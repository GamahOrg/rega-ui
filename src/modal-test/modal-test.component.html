<rega-modal>
  <div class="h-full w-full flex flex-col justify-between items-stretch">
    <h2 class="text-xl font-semibold">{{ $any(data).title }}</h2>
    <p class="text-gray-600">{{ $any(data).message }}</p>
    <div class="modal-actions flex justify-start items-center gap-3">
      <button class="btn cancel" (click)="onClose(false)">Cancel</button>
      <button class="btn confirm" (click)="onClose(true)">Confirm</button>
    </div>
  </div>
</rega-modal>
