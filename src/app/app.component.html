<div class="w-1/2 p-4">
  <rega-textarea [formControl]="controlArea" label="Label" />
</div>

<!-- [error]="control.touched && !!control.errors" -->
{{ "Value: " + controlArea.value }}
<br />
{{ "Is Valid: " + controlArea.valid }}
<br />
{{ "Errors: " + (controlArea.errors | json) }}

<div class="w-1/2 p-4">
  <rega-radio-group
    [formControl]="radio"
    [color]="'warning'"
    [size]="'large'"
    class="grid grid-cols-2 gap-4"
  >
    <rega-radio-button value="1">Label 1 </rega-radio-button>
    <rega-radio-button value="2">Label 2 </rega-radio-button>
  </rega-radio-group>
  <br />
  {{ "Radio Value: " + radio.value }}
</div>

<div class="w-1/2 p-4">
  <rega-checkbox
    [formControl]="control"
    description="Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen book. It has survived not only five centuries, but also the leap into electronic typesetting, remaining essentially unchanged. It was popularised in the 1960s with the release of Letraset sheets containing Lorem Ipsum passages, and more recently with desktop publishing software like Aldus PageMaker including versions of Lorem Ipsum."
    errorMsg="Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen book. It has survived not only five centuries, but also the leap into electronic typesetting, remaining essentially unchanged. It was popularised in the 1960s with the release of Letraset sheets containing Lorem Ipsum passages, and more recently with desktop publishing software like Aldus PageMaker including versions of Lorem Ipsum."
  />
</div>

<div class="w-1/2 p-4">
  <rega-file-upload [multiple]="false" (onSelectFiles)="onFileChange($event)">
    <div>Upload</div>
  </rega-file-upload>
</div>

<div class="w-1/2 p-4">
  <rega-drop-zone
    title="Drag and drop files here to upload"
    description="Maximum file size allowed is 2MB, supported file formats include .jpg, .png, and.pdf."
    (onSelectFiles)="onFileChange($event)"
  >
  </rega-drop-zone>
</div>

<div class="w-1/2 p-4">
  <div
    [formGroup]="selectionGroup"
    class="flex flex-col justify-evenly items-center gap-4"
  >
    <rega-card
      formControlName="selection1"
      [type]="'selectable'"
      title="Card Title 1"
      description="Card content 1"
    />

    <rega-card
      formControlName="selection2"
      [type]="'selectable'"
      [color]="'warning'"
      title="Card Title 2"
      description="Card content 2"
    />
  </div>
</div>
