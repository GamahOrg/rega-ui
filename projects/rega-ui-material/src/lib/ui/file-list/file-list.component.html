@if (fileList().length) {
  <div class="flex flex-col justify-start items-stretch gap-2">
    @for (file of fileList(); track $index) {
      @let fileSuccess = file.type === FileState.SUCCESS;
      <div
        [ngClass]="fileSuccess ? 'border-[#d2d6db]' : 'border-errorColor'"
        class="file-label flex flex-col justify-center items-stretch border-[1px]"
      >
        <div class="h-[36px] flex justify-between items-center gap-3 py-[4px] px-2">
          <div class="flex-1 flex justify-start items-center gap-3">
            <div
              [ngClass]="fileSuccess ? 'success' : 'error'"
              class="icon flex justify-center items-center rounded-full"
            >
              <mat-icon
                class="block"
                [fontIcon]="fileSuccess ? 'done' : 'priority_high'"
              />
            </div>
            <span class="w-[80%] name truncate">{{ file.file.name }}</span>
          </div>

          <button
            class="h-8 w-8 flex justify-center items-center rounded-full outline-none border-none"
            (click)="onRemoveFile.emit(file)"
          >
            <mat-icon class="block close-icon !text-borderColor" fontIcon="close" />
          </button>
        </div>

        @if (!fileSuccess) {
          <div
            class="error-msg flex justify-between items-center text-errorColor border-t-[1px] border-[#d2d6db] py-[4px] px-2"
          >
            <span class="name !font-light">{{ file.msg }}</span>
          </div>
        }
      </div>
    }
  </div>
}
