<div [ngClass]="classes()">
  @if (label()) {
    <label
      [attr.for]="uniqueId()"
      [innerHTML]="label()"
      class="block mb-1 px-[2px] text-sm font-medium text-[#161616]"
    ></label>
  }

  <div class="relative underline-animation">
    <textarea
      [id]="uniqueId()"
      [(ngModel)]="value"
      [disabled]="linkedDisabled()"
      [placeholder]="placeholder()"
      [readOnly]="readOnly()"
      type="text"
      class="max-w-full ring-0 focus:ring-0 block p-2.5"
      (input)="onInputChange($event)"
      (blur)="onTouched(); touched.set(true)"
    ></textarea>
  </div>
</div>
