<div class="flex flex-col justify-start items-stretch gap-5">
  <div class="flex justify-start items-center">
    <rega-button
      [label]="label()"
      [size]="btnSize()"
      [loading]="btnLoading()"
      [disabled]="disabled()"
      [btnClass]="btnClass()"
      (click)="input.click(); $event.stopPropagation()"
    >
      <ng-content />
    </rega-button>
  </div>

  <rega-file-list [fileList]="selectedFiles()" (onRemoveFile)="removeFile($event)" />
</div>

<input
  #input
  [multiple]="multiple()"
  [accept]="accept()"
  type="file"
  hidden
  (change)="selectFile($event, input?.files)"
/>
