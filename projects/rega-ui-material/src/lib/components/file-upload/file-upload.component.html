<div class="flex flex-col justify-start items-stretch gap-5">
  <div class="flex justify-start items-center">
    <rega-button
      [label]="label()"
      [size]="size()"
      [disabled]="disabled()"
      [btnClass]="btnClass()"
      (click)="input.click(); $event.stopPropagation()"
    />
  </div>

  @if (selectedFiles().length) {
    <div class="flex flex-col justify-start items-stretch gap-2">
      @for (file of selectedFiles(); track $index) {
        <div class="file-label flex justify-between items-center gap-3 py-[4px] px-2">
          <div class="flex-1 flex justify-start items-center gap-3">
            @let fileSuccess = file.type === FileState.SUCCESS;
            <div
              [ngClass]="fileSuccess ? 'success' : 'error'"
              class="icon flex justify-center items-center rounded-full"
            >
              <mat-icon
                class="block"
                [fontIcon]="fileSuccess ? 'done' : 'priority_high'"
              />
            </div>
            <span class="w-[80%] name truncate">{{ file.file.name }}</span>
          </div>

          <button
            class="h-8 w-8 flex justify-center items-center rounded-full outline-none border-none"
            (click)="onRemoveFile(file)"
          >
            <mat-icon class="block close-icon !text-borderColor" fontIcon="close" />
          </button>
        </div>
      }
    </div>
  }
</div>

<input
  #input
  [multiple]="multiple()"
  [accept]="accept()"
  type="file"
  hidden
  (change)="selectFile($event, input?.files)"
/>
