<div class="flex flex-col justify-start items-stretch gap-5">
  <div
    regaDropzone
    [ngClass]="linkedDisabled() ? 'cursor-auto' : 'cursor-pointer'"
    class="flex justify-start items-center outline-none"
    (fileDropped)="!linkedDisabled() && draggable() && selectFile(null, $event)"
    (click)="input.click(); $event.stopPropagation()"
  >
    <ng-content>
      <rega-button
        [label]="label()"
        [size]="btnSize()"
        [loading]="btnLoading()"
        [disabled]="linkedDisabled()"
        [btnClass]="btnClass()"
      />
    </ng-content>
  </div>

  @if (selectedFiles().length) {
    <rega-file-list [fileList]="selectedFiles()" (onRemoveFile)="removeFile($event)" />
  }
</div>

<input
  #input
  [multiple]="multiple()"
  [accept]="accept()"
  type="file"
  hidden
  (change)="selectFile($event, input?.files)"
/>
