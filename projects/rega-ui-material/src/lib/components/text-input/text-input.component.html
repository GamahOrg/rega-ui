<div [ngClass]="classes()">
  @if (label()) {
    <label
      [attr.for]="uniqueId()"
      [innerHTML]="label()"
      class="block mb-1 px-[2px] text-sm font-medium text-[#161616]"
    >
    </label>
  }

  <div class="relative underline-animation">
    @if (prefix() || inputPrefix()) {
      <button
        [ngClass]="prefixClass()"
        class="absolute prefix h-[calc(100%-2px)] start-[1px] bottom-[1px] flex justify-center items-center text-[#6c737f] bg-semiLightColor"
      >
        @if (inputPrefix()) {
          <ng-container *ngTemplateOutlet="inputPrefix()" />
        } @else {
          {{ prefix() }}
        }
      </button>
    }

    <input
      [id]="uniqueId()"
      [(ngModel)]="value"
      [disabled]="linkedDisabled()"
      [placeholder]="placeholder()"
      [readOnly]="readOnly()"
      type="text"
      class="ring-0 focus:ring-0 block w-full p-2.5"
      (input)="onInputChange($event)"
      (blur)="onTouched(); touched.set(true)"
    />

    @if (suffix() || inputSuffix()) {
      <button
        [ngClass]="suffixClass()"
        class="absolute suffix h-[calc(100%-2px)] end-[1px] bottom-[1px] flex justify-center items-center text-[#6c737f] bg-semiLightColor"
      >
        @if (inputSuffix()) {
          <ng-container *ngTemplateOutlet="inputSuffix()" />
        } @else {
          {{ suffix() }}
        }
      </button>
    }
  </div>
</div>
