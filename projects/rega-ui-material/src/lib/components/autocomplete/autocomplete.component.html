<div [ngClass]="classes()">
  <div class="relative underline-animation mb-1">
    @let icon = !autocomplete.overlayVisible ? "pi pi-angle-down" : "pi pi-angle-up";
    <p-autocomplete
      #autocomplete
      [suggestions]="filteredOptions()"
      [optionValue]="optionValue()"
      [lazy]="lazy()"
      [multiple]="multiple()"
      [dropdown]="true"
      [virtualScroll]="true"
      [virtualScrollItemSize]="34"
      [placeholder]="placeholder()"
      [dropdownIcon]="icon"
      field="label"
      (onFocus)="autocomplete.overlayVisible = true; overlayVisible.set(true)"
      (click)="autocomplete.overlayVisible = true; overlayVisible.set(true)"
      (onHide)="overlayVisible.set(false)"
      (onSelect)="onSelectOption($event)"
      (completeMethod)="filterOptions($event)"
    >
      <ng-template #item let-option>
        @let isSelected = !!value && (value | isOptionSelected: option : multiple());
        <div
          class="w-full flex justify-between items-center py-[2px] px-2 rounded-lg gap-2"
          (click)="isSelected && multiple() && onUnselectOption(option)"
        >
          <div>{{ option.label }}</div>

          @if (isSelected) {
            <span class="material-icons text-gray-700">done</span>
          }
        </div>
      </ng-template>

      <ng-template #selecteditem let-option>
        <div
          class="h-8 text-base text-[#1f2a37] bg-[#f9fafb] border border-disabledBorderColor inline-flex items-center justify-center gap-4 font-medium px-3 py-0 rounded-full border-solid"
        >
          <div>{{ option }}</div>

          <button
            class="flex justify-center items-center text-gray-700 hover:text-[#1f2a37] outline-none border-none"
            (click)="multiple() && onUnselectOption(option)"
          >
            <span class="material-icons transition text-base hover:scale-125">close</span>
          </button>
        </div>
      </ng-template>
    </p-autocomplete>
  </div>
</div>
