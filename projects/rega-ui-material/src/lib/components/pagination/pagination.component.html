<nav [ngClass]="classes()" class="h-auto w-auto" aria-label="Pagination">
  <ul class="flex justify-center items-center gap-3 list-none p-0">
    <li>
      <rega-button
        [label]="''"
        [size]="size()"
        [disabled]="currentPage() === 1"
        variant="transparent"
        btnClass="arrow"
        (click)="currentPage() !== 1 && pageChange(currentPage() - 1)"
      >
        <span
          [ngClass]="{ 'text-disabledColor': currentPage() === 1 }"
          class="material-icons text-[#384250]"
          >chevron_left</span
        >
      </rega-button>
    </li>

    @for (page of pageList(); track $index) {
      <li>
        @if (page !== -1) {
          <rega-button
            [label]="''"
            [size]="size()"
            [class.active]="page === currentPage()"
            variant="transparent"
            (click)="pageChange(page)"
          >
            <span class="text-[#384250]">{{ page }}</span>
          </rega-button>
        } @else {
          <custom-dropdown
            [options]="pages()"
            dropdownClass="border-none !p-0 !h-auto"
            overlayClass="!w-20 max-h-60 shadow-lg"
          >
            <span label class="dropdown-label text-base font-medium">...</span>

            <ng-template #optionTemp let-option>
              @let selected = option.index === currentPage();

              <button
                [ngClass]="{ selected }"
                class="option flex justify-between items-center gap-2 cursor-pointer px-3 py-1 hover:bg-slate-50"
                (click)="pageChange(option.index)"
              >
                <span class="option-label">{{ option.index }}</span>

                @if (selected) {
                  <span class="material-icons text-[#384250]">done</span>
                }
              </button>
            </ng-template>
          </custom-dropdown>
        }
      </li>
    }

    <li>
      <rega-button
        [label]="''"
        [size]="size()"
        [disabled]="currentPage() === count()"
        variant="transparent"
        btnClass="arrow"
        (click)="currentPage() !== count() && pageChange(currentPage() + 1)"
      >
        <span
          [ngClass]="{ 'text-disabledColor': currentPage() === count() }"
          class="material-icons text-[#384250]"
          >navigate_next</span
        >
      </rega-button>
    </li>
  </ul>
</nav>
