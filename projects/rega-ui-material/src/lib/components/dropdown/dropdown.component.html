<div [ngClass]="classes()">
  @if (label()) {
    <label for="input" class="block mb-1 px-[2px] text-sm font-medium text-gray-900">{{
      label()
    }}</label>
  }

  <div class="relative underline-animation">
    <p-select
      #select
      [(ngModel)]="value"
      [options]="filteredOptions()"
      [optionValue]="optionValue()"
      [disabled]="linkedDisabled()"
      [placeholder]="placeholder()"
      [emptyMessage]="emptyMessage()"
      [showClear]="showClear()"
      [virtualScroll]="lazy()"
      [virtualScrollOptions]="lazyOptions"
      (onChange)="onValueChange($event.value)"
      (onClear)="searchInput.set('')"
      (onBlur)="onTouched(); touched.set(true)"
      (onHide)="overlayVisible.set(select.overlayVisible || false)"
    >
      <ng-template #item let-option>
        @let isSelected = (!!value() || value() == 0) && value() == option.id;
        @if (dropdownOption()) {
          <ng-container
            *ngTemplateOutlet="
              dropdownOption();
              context: { $implicit: option, isSelected }
            "
          />
        } @else {
          <button [disabled]="linkedDisabled()" class="option">
            <span>{{ option.label }}</span>

            @if (isSelected) {
              <span class="material-icons text-gray-700">done</span>
            }
          </button>
        }
      </ng-template>

      <ng-template #dropdownicon>
        <span class="material-icons flex justify-center items-center text-gray-700">
          {{ select.overlayVisible ? "expand_less" : "expand_more" }}
        </span>
      </ng-template>

      <ng-template #header>
        <ng-container *ngTemplateOutlet="dropdownHeader()" />
        @if (filter()) {
          <div
            class="filter w-full flex justify-center items-center p-2 shadow-md"
            (click)="$event.stopPropagation()"
          >
            <input
              [(ngModel)]="searchInput"
              class="w-full rounded-md outline-none border border-gray-200 focus:ring-0 focus:border-gray-400 px-2"
              type="text"
            />
          </div>
        }
      </ng-template>

      <ng-template #footer>
        <ng-container *ngTemplateOutlet="dropdownFooter()" />
      </ng-template>
    </p-select>
  </div>
</div>
